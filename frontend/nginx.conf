# Full nginx.conf — replaces /etc/nginx/nginx.conf in the image so every
# write nginx does at startup (pid file, temp dirs) goes to /tmp.
# Compose mounts /tmp as a tmpfs even with read_only: true, so this works.
worker_processes auto;
pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;
    sendfile     on;
    keepalive_timeout 65;

    # All temp dirs in /tmp (tmpfs) — none of these are needed for a static
    # file server, but nginx requires them to exist and be writable.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;

        # Security headers — HSTS is Caddy's job (it's the TLS terminator).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
