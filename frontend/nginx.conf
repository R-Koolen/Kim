# Static file server for the built SPA. Caddy (on the host) is the reverse
# proxy that routes kim.lpd50.uk/api/* to the backend container — this server
# only ever serves dist/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Filenames aren't content-hashed, so always revalidate rather than risk
    # browsers serving a stale app.js/app.css after a redeploy.
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
